name: CI

on:
  push:
    branches: [main]
  pull_request:
  # upstream releases (napari, Qt, brainglobe, ...) can break a fresh install without any
  # push from us -- re-check against the newest dependencies every Monday
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # linters come from uv.lock so a new ruff/mypy release can't fail CI on its own
      - run: uv sync --extra lint --locked
      - run: uv run ruff check .
      - run: uv run mypy regrender/

  test:
    name: test (${{ matrix.os }}, ${{ matrix.deps }} deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # locked = uv.lock (reproducible dev env)
        # latest = newest releases, i.e. what `pip install regrender` gets today
        deps: [locked, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # napari needs a real display with OpenGL + Qt's xcb system libs (no-op on macOS)
      - uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true

      - name: Install (locked)
        if: matrix.deps == 'locked'
        run: uv sync --extra test --locked  # also fails if uv.lock is stale vs pyproject
      - name: Install (latest)
        if: matrix.deps == 'latest'
        run: uv sync --extra test --upgrade

      - run: uv pip list | grep -iE "^(napari|pyqt|qtpy|vispy|magicgui|brainglobe)"

      # launch smoke test uses a synthetic in-test atlas: no download (GIN 403s GitHub runners)
      - run: uv run pytest -v

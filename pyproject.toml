[project]
name = "regrender"
version = "0.1.2"
description = "2D mouse brain registration, ROI/Probe annotation, and brainrender reconstruction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yu-Ting Wei", email = "ytsimon2004@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["neuroscience", "brain-atlas", "registration", "brainrender", "napari", "allen-ccf"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "argclz>=1.0.1",
    "neuralib-atlas[brainrender]>=0.7.3",
    "napari[pyqt6]>=0.10",
    # 3.x moved atlases to OME-Zarr/S3 with a new cache layout (existing ~/.brainglobe atlases
    # are not found); untested with neuralib + the apps, so stay on 2.x until migrated
    "brainglobe-atlasapi>=2.3,<3",
    "imageio",
    "natsort>=8",  # natural slice order (slice_2 before slice_10); only transitive via brainglobe-utils otherwise
    "rich",
]

[project.optional-dependencies]

doc = [
    'sphinx',
    'pydata-sphinx-theme',
    'sphinx_copybutton'
]

test = [
    'pytest'
]

lint = [
    'ruff',
    'mypy',
]

[project.urls]
Homepage = "https://github.com/ytsimon2004/regrender"
Repository = "https://github.com/ytsimon2004/regrender"
Documentation = "https://regrender.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
regrender = "regrender.__main__:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]  # import sorting
ignore = ["E731", "E741"]  # local lambda helpers and `l` names are deliberate

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true  # napari/brainrender/magicgui ship no stubs

# GUI glue: heterogeneous state dicts + PyQt5 enum stubs read as `object`, not real bugs.
# Core logic (_core.py) and the other modules stay type-checked.
[[tool.mypy.overrides]]
module = ["regrender._app", "regrender.main_register"]
ignore_errors = true

[tool.pytest.ini_options]
markers = [
    "gui: launches the napari GUI (needs a display with OpenGL); deselect with -m 'not gui'",
]

# PyQt6's shipped .pyi stubs contain a syntax error mypy can't parse; we only use Qt via qtpy anyway
[[tool.mypy.overrides]]
module = ["PyQt6", "PyQt6.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
